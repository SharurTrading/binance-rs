[package]
name = "binance-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An unofficial async, provider-native Rust client for Binance APIs"
repository = "https://github.com/SharurTrading/binance-rs"
homepage = "https://github.com/SharurTrading/binance-rs"
readme = "README.md"
license = "MIT-0"
keywords = ["binance", "trading", "futures", "api-client"]
categories = ["api-bindings", "asynchronous", "network-programming"]
# Publishing requires a separately reviewed release.
publish = false
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md", "/SECURITY.md", "/docs/**", "/schema/**", "/scripts/codegen/*.py", "/clippy.toml", "/rust-toolchain.toml", "/AGENTS.md", "/CONTRIBUTING.md"]

[dependencies]
aws-lc-rs = "1.15"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rust_decimal = { version = "1.40", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-websockets = { version = "0.13.3", features = ["client", "aws_lc_rs", "getrandom", "rustls-bring-your-own-connector"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio-websockets = { version = "0.13.3", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "io-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Capability-qualified public names stay readable when imported from the crate root.
module_name_repetitions = "allow"
await_holding_lock = "deny"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
